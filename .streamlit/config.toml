# BLUESTAR — Midnight Luxe / base theme
# Aligne le chrome NATIF de Streamlit sur la charte CSS (sans ce fichier,
# les overlays/menus/spinners restent hors-charte).

[theme]
base = "dark"
primaryColor = "#22D3EE"
backgroundColor = "#030712"
secondaryBackgroundColor = "#080D18"
textColor = "#F8FAFC"
font = "sans-serif"

[client]
toolbarMode = "minimal"
showErrorDetails = true

[server]
enableStaticServing = false

[browser]
gatherUsageStats = false
